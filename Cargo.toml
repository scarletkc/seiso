[package]
name = "seiso"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/scarletkc/seiso"
description = "A Markdown convention and linter for project docs written by AI and read by humans and agents"
readme = "README.md"
documentation = "https://github.com/scarletkc/seiso/blob/main/docs/README.md"
include = ["/src/**", "/docs/rules/**", "/Cargo.toml", "/README.md", "/LICENSE"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
keywords = ["markdown", "documentation", "linter", "docs-as-code", "ai-agents"]

[dependencies]
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
markdown = "1.0"
mimalloc = "0.1"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
insta = { version = "1.43", features = ["json"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = true
