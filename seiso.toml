include = ["**/*.md"]
preview = true
exclude = ["tests/fixtures/**", ".github/pull_request_template.md", ".agents/skills/**"]

[[kinds]]
path = "README.md"
kind = "readme"

[[kinds]]
path = "CONTRIBUTING.md"
kind = "howto"

[[kinds]]
path = "docs/**"
kind = "reference"

[[kinds]]
path = "docs/release-notes/**"
kind = "changelog"

[lint.ptr]
catalog-dirs = ["docs/rules/"]
