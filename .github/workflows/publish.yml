name: Build and publish distributions

on:
  workflow_dispatch:
    inputs:
      publish_all:
        description: Publish to npm, crates.io, PyPI, and GitHub Releases
        type: boolean
        default: false
      publish_npm:
        description: Publish only the verified npm archive
        type: boolean
        default: false
      publish_crates:
        description: Publish the verified seiso package to crates.io
        type: boolean
        default: false
      publish_pypi:
        description: Publish the verified wheels and source archive to PyPI
        type: boolean
        default: false
      publish_github:
        description: Create a GitHub Release without registry uploads
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seiso-distributions
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m scripts.release.release check
        id: version
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: cargo test --locked
      - if: inputs.publish_all || inputs.publish_github || !(inputs.publish_npm || inputs.publish_crates || inputs.publish_pypi)
        run: python -m scripts.release.github_release notes
      - if: inputs.publish_all || inputs.publish_github || !(inputs.publish_npm || inputs.publish_crates || inputs.publish_pypi)
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  crates:
    if: inputs.publish_all || inputs.publish_github || inputs.publish_crates || !(inputs.publish_npm || inputs.publish_pypi)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m scripts.release.release crates
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-package
          path: target/package/seiso-${{ needs.preflight.outputs.version }}.crate
          if-no-files-found: error

  wheels:
    if: inputs.publish_all || inputs.publish_github || inputs.publish_npm || inputs.publish_pypi || !inputs.publish_crates
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        run: cargo test --locked
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: build
          args: --release --locked --out dist
          manylinux: '2014'
      - name: Install and exercise the wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m scripts.release.verify_installation --python-package
          seiso rule KND001
          seiso check README.md --select KND --output-format json > checked.json
          python -c "import json; assert json.load(open('checked.json', encoding='utf-8')) == []"
          seiso parse README.md --output-format json > parsed.json
          python -c "import json; r=json.load(open('parsed.json', encoding='utf-8')); assert len(r['files']) == 1 and not r['errors']"
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: sdist
          args: --out dist
      - run: python -m scripts.release.verify_distributions dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  npm:
    if: inputs.publish_all || inputs.publish_github || inputs.publish_npm || !(inputs.publish_crates || inputs.publish_pypi)
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - run: python -m scripts.release.prepare_npm --wheels dist
      - run: npm pack ./npm/seiso --pack-destination dist
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m scripts.release.release npm
      - name: Exercise the packed npm executable
        run: |
          python -m scripts.release.verify_installation -- npm exec --yes --package ./dist/*.tgz -- seiso
          npm exec --yes --package ./dist/*.tgz -- seiso rule KND001
          npm exec --yes --package ./dist/*.tgz -- seiso check README.md --select KND --output-format json > checked.json
          python -c "import json; assert json.load(open('checked.json', encoding='utf-8')) == []"
          npm exec --yes --package ./dist/*.tgz -- seiso parse README.md --output-format json > parsed.json
          python -c "import json; r=json.load(open('parsed.json', encoding='utf-8')); assert len(r['files']) == 1 and not r['errors']"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  publish-npm:
    if: inputs.publish_all || inputs.publish_npm
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - run: python -m scripts.release.release npm --execute

  publish-crates:
    if: inputs.publish_all || inputs.publish_crates
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish seiso if the version is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python -m scripts.release.release crates --execute

  pypi:
    if: inputs.publish_all || inputs.publish_pypi
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    if: >-
      always() && !cancelled() &&
      (inputs.publish_all || inputs.publish_github) &&
      needs.preflight.result == 'success' &&
      needs.wheels.result == 'success' && needs.npm.result == 'success' && needs.crates.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped') &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    needs: [preflight, wheels, npm, crates, publish-npm, publish-crates, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cargo-package
          path: dist
      - name: Create release and upload missing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.github_release publish --output release-notes/release-notes.md --execute
