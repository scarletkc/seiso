name: Build and publish distributions

on:
  workflow_dispatch:
    inputs:
      publish_all:
        description: Publish to npm, crates.io, PyPI, and GitHub Releases
        type: boolean
        default: false
      publish_npm:
        description: Publish only the verified npm archive
        type: boolean
        default: false
      publish_crates:
        description: Publish the verified seiso package to crates.io
        type: boolean
        default: false
      publish_pypi:
        description: Publish the verified wheels and source archive to PyPI
        type: boolean
        default: false
      publish_github:
        description: Create a GitHub Release without registry uploads
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: seiso-distributions
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m scripts.release.release check
        id: version
      - run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: cargo test --locked
      - if: inputs.publish_all || inputs.publish_github || !(inputs.publish_npm || inputs.publish_crates || inputs.publish_pypi)
        run: python -m scripts.release.github_release notes
      - if: inputs.publish_all || inputs.publish_github || !(inputs.publish_npm || inputs.publish_crates || inputs.publish_pypi)
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  crates:
    if: inputs.publish_all || inputs.publish_github || inputs.publish_crates || !(inputs.publish_npm || inputs.publish_pypi)
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m scripts.release.release crates
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-package
          path: target/package/seiso-${{ needs.preflight.outputs.version }}.crate
          if-no-files-found: error

  wheels:
    if: inputs.publish_all || inputs.publish_github || inputs.publish_npm || inputs.publish_pypi || !inputs.publish_crates
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-x64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            image: python:3.12-alpine
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: linux-arm64-musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            image: python:3.12-alpine
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: win32-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Shared preflight runs the Rust tests on Linux x64. On a musl row, cargo test would repeat
      # the glibc row's host tests, so its wheel is exercised on Alpine instead.
      - if: matrix.platform != 'linux-x64' && !matrix.image
        run: cargo test --locked
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: build
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux || '2014' }}
      - name: Install and exercise the wheel
        if: '!matrix.image'
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m scripts.release.verify_installation --python-package
      - name: Install and exercise the wheel in ${{ matrix.image }}
        if: matrix.image
        run: >-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/work" -w /work ${{ matrix.image }}
          sh -euc 'python -m pip install --root-user-action=ignore dist/*.whl &&
          python -m scripts.release.verify_installation --python-package'
      - if: matrix.platform == 'linux-x64'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: '1.15.0'
          command: sdist
          args: --out dist
      - run: python -m scripts.release.verify_distributions dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  npm:
    if: inputs.publish_all || inputs.publish_github || inputs.publish_npm || !(inputs.publish_crates || inputs.publish_pypi)
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - run: python -m scripts.release.prepare_npm --wheels dist
      - run: npm pack ./npm/seiso ./npm/seiso-* --pack-destination dist
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m scripts.release.release npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error

  npm-install:
    needs: [preflight, npm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
          - runner: ubuntu-latest
            image: node:22-alpine
          - runner: ubuntu-24.04-arm
          - runner: ubuntu-24.04-arm
            image: node:22-alpine
          - runner: macos-15-intel
          - runner: macos-latest
          - runner: windows-latest
          - runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      # The local registry serves the packed archives, so npm selects the platform package itself.
      - name: Install the packed npm packages and exercise the executable
        if: '!matrix.image'
        shell: bash
        env:
          PACKAGE: '@scarletkc/seiso@${{ needs.preflight.outputs.version }}'
        run: >-
          python -m scripts.release.npm_registry dist --
          python -m scripts.release.verify_installation -- npm exec --yes --package "$PACKAGE" -- seiso
      - name: Install the packed npm packages in ${{ matrix.image }} and exercise the executable
        if: matrix.image
        env:
          PACKAGE: '@scarletkc/seiso@${{ needs.preflight.outputs.version }}'
        run: >-
          python -m scripts.release.npm_registry dist --
          docker run --rm --network host -e npm_config_registry -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD:/work" -w /work ${{ matrix.image }}
          sh -euc "apk add --no-cache python3 > /dev/null &&
          python3 -m scripts.release.verify_installation -- npm exec --yes --package $PACKAGE -- seiso"

  publish-npm:
    if: inputs.publish_all || inputs.publish_npm
    needs: [npm, npm-install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - run: python -m scripts.release.release npm --execute

  publish-crates:
    if: inputs.publish_all || inputs.publish_crates
    needs: crates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish seiso if the version is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python -m scripts.release.release crates --execute

  pypi:
    if: inputs.publish_all || inputs.publish_pypi
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    if: >-
      always() && !cancelled() &&
      (inputs.publish_all || inputs.publish_github) &&
      needs.preflight.result == 'success' &&
      needs.wheels.result == 'success' && needs.npm.result == 'success' && needs.npm-install.result == 'success' &&
      needs.crates.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped') &&
      (needs.pypi.result == 'success' || needs.pypi.result == 'skipped')
    needs: [preflight, wheels, npm, npm-install, crates, publish-npm, publish-crates, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cargo-package
          path: dist
      - name: Create release and upload missing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release.github_release publish --output release-notes/release-notes.md --execute
