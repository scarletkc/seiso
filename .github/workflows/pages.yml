name: Pages

on:
  push:
    branches: [main]
    tags: ['spec-v*']
  pull_request:
    branches: [main]
    paths: ['site/**', 'spec/**', 'assets/logo.svg', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

# Deploying runs share one group from checkout to deploy, and a newer run
# replaces a pending one, so the last deploy is built from the newest state.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # A deploy builds main's site whatever ref triggered it.
          ref: ${{ github.event_name != 'pull_request' && github.event.repository.default_branch || '' }}
          # The site reads every released version from its spec-v tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          # A pull request also builds the unreleased text, which is not deployed.
          SITE_UNRELEASED: ${{ github.event_name == 'pull_request' && '1' || '' }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    # Pages identifies a deployment by its commit, so a second deploy of the
    # same commit changes nothing. A specification release commit is deployed
    # by its spec-v tag push, whose build includes the new version, and not by
    # the earlier push to main, whose build cannot.
    if: >-
      github.event_name != 'pull_request' &&
      !(github.ref == 'refs/heads/main' &&
        startsWith(github.event.head_commit.message, 'chore(release): prepare spec-v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
