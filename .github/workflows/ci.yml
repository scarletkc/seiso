name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select CI checks
        id: scope
        run: python3 -m scripts.ci.ci_scope

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ runner.os == 'Linux' && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        run: cargo run --locked -p seiso -- check --output-format concise
      - if: runner.os == 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          python -m unittest discover -s scripts/tests -p 'test_*.py'
          python -m unittest discover -s corpus -p 'test_*.py'
          python -m unittest discover -s corpus/evaluation -p 'test_*.py'

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked -p seiso -- check --output-format concise

  check:
    if: always()
    needs: [changes, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$DOCS_ONLY" in
            true)
              test "$DOCS_RESULT" = success
              test "$TEST_RESULT" = skipped
              ;;
            false)
              test "$TEST_RESULT" = success
              test "$DOCS_RESULT" = skipped
              ;;
            *) exit 1 ;;
          esac
